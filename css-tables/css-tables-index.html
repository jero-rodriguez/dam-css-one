<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Tables</title>
    <style>
        table,
        td,
        th {
            border: 2px solid black;
            border-collapse: collapse;
        }

        table {
            width: 40%;
            margin: auto;
        }

        tr {
            height: 40px;
        }

        td {
            vertical-align: center;
            text-align: center;
        }

        tr:hover {
            background-color: wheat;
        }

        tr:nth-child(odd) {
            background-color: lightgray;
        }
    </style>
</head>

<body>
    <h1>Ejemplos de CSS aplicado a Tablas</h1>
    <table>
        <tr>
            <th>Nombre</th>
            <th>Apellido</th>
            <th>Edad</th>
        </tr>
        <tr>
            <td>Juan</td>
            <td>Perez</td>
            <td>28</td>
        </tr>
        <tr>
            <td>Ana</td>
            <td>Gomez</td>
            <td>34</td>
        </tr>
        <tr>
            <td>Luis</td>
            <td>Martinez</td>
            <td>45</td>
        </tr>
    </table>
</body>

</html>
